# service.yaml — OWNED BY workspace-groundx-v2-ui-a7a4fac7, committed at repo root.
# Conforms to service.schema v1.2.0.
# DRAFT for handoff (2026-06-18) — every value marked VERIFY must be confirmed before commit.
apiVersion: v1

repo:
  name: workspace-groundx-v2-ui-a7a4fac7
  workspace: groundx
  role: fullstack                       # VERIFY against schema role enum. Fullstack monorepo (app + middleware);
                                       # "frontend" is the headline surface but it ships its own Express middleware.
  description: >-
    GroundX Studio v2 web UI — chat-driven document-onboarding + knowledge app.
    Two-mode model: Onboarding (guided F1-F7) and Steady (everyday use); drives
    viewer widgets (PdfViewer/Extract/SmartReport/Integrate) over a typed scope.
  owner: Ben Fletcher
  repo_url: VERIFY                     # from `git remote -v` (origin) — not yet captured

stack:
  language: typescript
  module_system: esm
  workspace_root: true                 # v1.2 — npm-workspaces monorepo
  packages: [shared, app, middleware]
  frontend: "Vite + React + TS + MUI/Emotion, react-router v7, pdfjs-dist, framer-motion; Sentry + PostHog"
  middleware: "Express + TS, MySQL (mysql2), pdf-lib, helmet, rate-limit; pino + OpenTelemetry + Sentry + prom-client"
  shared: "@groundx/shared — cross-cutting types + intent catalog"

entrypoints:
  contributor: AGENTS.md
  frontend_runtime: app/src/main.tsx -> app/src/App.tsx
  middleware_runtime: middleware/src/index.ts -> middleware/src/app.ts
  shared: shared/src/index.ts

clone:                                 # v1.1 affordance
  initialized_from: groundx-web-ui-scaffold
  note: >-
    VERIFY — the ARCHITECTURE_NOTES.md describes this repo using the canonical scaffold's own
    self-description. Confirm whether this is a managed INSTANCE cloned from the scaffold, or a
    v2 line of the scaffold itself. This determines role, edge direction, and CLAUDE.md propagation.

run:                                   # v1.1 affordance
  setup: "npm install && npm run setup:env"   # needs PARTNER_API_KEY, LLM_SERVICE, LLM_MODEL_ID, LLM_API_KEY
  dev: "npm run dev"                   # app :5173, middleware :3001 (frontend /api proxies to middleware)
  smoke: "npm run verify:preview"

privileged: false                      # deploys itself via GH Actions; performs no privileged cluster ops

dependencies:
  internal:
    - name: groundx-web-ui-scaffold
      kind: runtime-clone              # VERIFY kind — initialized/cloned from the canonical scaffold
      direction: outbound
      contract:
        schematized: false
        source_of_truth: groundx-web-ui-scaffold
        note: pins layout/stack; this repo is built on top of the scaffold (independently agent-edited)
  external:
    - name: groundx-api
      kind: http-api
      endpoint: https://api.groundx.ai/api/v1   # via middleware GroundX service client (RAG search)
      auth: x-api-key
      direction: outbound
      capability: "GroundX RAG search (RBAC-filtered, $and-composed queries)"
      schematized: false
    - name: llm-service
      kind: http-api
      endpoint: "env-configured (LLM_SERVICE / LLM_MODEL_ID / LLM_API_KEY)"
      auth: api-key
      direction: outbound
      capability: "grounded answers + light planner/compression (2 client tiers)"
      schematized: false
    - name: partner-api
      kind: http-api
      endpoint: "env-configured (GROUNDX_PARTNER_API_KEY)"                 # partner-key path for anonymous access (PARTNER_API_KEY)
      auth: partner-key
      direction: outbound
      schematized: false
    - name: mysql
      kind: database
      direction: outbound
      auth: connection-string
      sensitivity: contains-user-data
      capability: >-
        persistence — source of truth (anon + authed); tables chat_sessions, chat_messages,
        conversation_summaries, chat_session_entities, viewer_events, intent_log, project_grants, templates

contracts:
  - kind: widget-contract
    surface: docs/agents/widget-contract.md + docs/agents/template-scope-results.md
    schematized: true
    note: drift-guarded; locked 2026-06-14
  - kind: chat-sse-envelope
    surface: app api/sseFrames.ts + middleware POST /api/chat/messages
    schematized: false
    note: "SSE frame protocol (meta/token/activity/envelope/error) + turnKey idempotency + Last-Event-ID resume"
  - kind: persistence-round-trip
    surface: middleware/src/db (AppRepository)
    schematized: true
    note: persistedColumnPolicy + recurrence-drift guards

agent_boundaries:
  - zone: provider stack (app/src/App.tsx)
    rule: provider order is load-bearing — must equal runtime mount
    gate: App.test.tsx smoke chain (burned-in from 2026-05-25 prod crash)
  - zone: ownership / RBAC
    rule: every mutating route asserts ownership; server-derived role/RBAC never trusted from client
    gate: assertChatSessionOwnership (IDOR guard)
  - zone: service clients
    rule: real clients always (no mock mode); tests swap at the DI seam
    gate: makeFakeApi / injected repository
  - zone: methodology
    rule: TDD + round-trip + OpenSpec + adversarial review
    gate: docs/agents/discipline.md

quality_gates:
  - "npm test (shared build + alias/env/deploy checks + app + middleware unit/contract)"
  - "npm run test:e2e (Playwright)"
  - "npm run verify:preview (smoke)"

openspec:
  status: active                       # NOT none — live workflow (the eyelevel-fern-config accuracy bug we won't repeat)
  active_changes: 8                    # 8 changes / 21 steps (per AGENTS.md locked set)
  location: openspec/

conversion:
  status: in-progress                  # mid-flight: notes done, deep-dives explicitly unfinished
  onboarded_at: 2026-06-18
  architecture_notes: ARCHITECTURE_NOTES.md   # RECONCILE: schema wants this committed at repo root; currently external
  agents_md: exists                    # mature lean hub-and-spoke -> docs/agents/ spokes
  claude_md: added                     # thin "See @AGENTS.md" pointer (this handoff)
  ai_first_readiness: HIGH             # already running OpenSpec + discipline maturely
  derived: false                       # independent node — NOT generated_from (agents edit it; opposite of a derived artifact)
  known_gaps:
    - ChatStore/EntitySessionStore mounts via OnboardingSessionProvider — design intent unclear (likely migration artifact)
    - Streaming/resume internals (TurnRunner/streamPump/turnEventBuffer) — contract traced, impl unread
    - RAG + citation core (searchGroundX/callGroundedLlm/attribution) — heavily speced, impl unread
    - Template/Scope/Results lifecycle + 5-tier widget contract — docs read, not code-verified

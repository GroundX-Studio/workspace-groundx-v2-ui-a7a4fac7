rules:
  proposal:
    - Keep it short; focus on the user-facing change, the affected app/page(s), and why
    - List which backend contracts the change depends on; flag if a new endpoint is needed
      in the owning service
    - If open design questions remain after consulting AGENTS.md and existing specs, use the
      superpowers:brainstorming skill to resolve them; otherwise note "none" in proposal.md
    - State what is in scope and out of scope.
    - Identify the affected wireframe frames (F-series in spec-flow.jsx), the touched scaffold modules, and the closure-gate tests.
  specs:
    - Use the superpowers:test-driven-development skill to derive testable Given/When/Then
      scenarios; every requirement has at least one scenario
    - Cover component, page, and interaction behavior; loading, empty, error, offline,
      and unauthorized states explicitly
    - State accessibility requirements (keyboard nav, ARIA, focus order, contrast)
    - State responsive behavior across mobile / tablet / desktop breakpoints
    - Cross-reference the originating wireframe (spec-flow.jsx function or groundx-wireframes mock card) so future audits can re-verify.
  design:
    - Name the source of truth and the scaffold module that mirrors it.
    - Identify drift-prevention tests (testIDs, contract tests) and which command proves the requirement holds.
    - Only required for non-trivial state/data flows (auth, multi-step forms, realtime) —
      otherwise leave minimal
    - When present, prefer a component/data-flow sketch over prose; identify which store /
      query / context owns each piece of state
    - When a decision warrants an ADR, use the architectural-decision-records skill and write
      it to docs/adr/<LINEAR-TICKET>-<kebab>.md (Linear ticket prefix mandatory). Reference
      the ADR filename inline in design.md. Cross-service decisions live in the producing service.
  tasks:
    - Implementation runs through the ambient Superpowers loop (brainstorm → plan → TDD →
      review → finish) — do not restate it; list only the artifact-specific work
    - Include component stories and a manual QA path covering the golden flow per affected app
    - Flag missing unit-test coverage in the PR description if no test runner exists
    - Start with the failing test (round-trip per docs/agents/discipline.md Rule 9), then implementation tasks, then closure verification.
    - Include the dead-column / dead-endpoint / dead-context cross-check step explicitly.
